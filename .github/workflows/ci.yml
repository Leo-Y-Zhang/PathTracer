name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run
      # Full gallery renders are minutes each; CI only proves the CLI
      # end-to-end with a tiny deterministic smoke render.
      - name: Smoke render
        run: |
          node dist/cli.js render scenes/cornell.json --out smoke.png --spp 4 --width 64
          node -e "const b=require('fs').readFileSync('smoke.png'); if(b.length<100||b[1]!==0x50) throw new Error('bad png'); console.log('smoke render ok:', b.length, 'bytes')"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
